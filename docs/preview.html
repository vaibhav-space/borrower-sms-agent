<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture Preview - Borrower Inbound SMS Servicing Pipeline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 30px;
      color: #0f172a;
    }
    .header {
      max-width: 1320px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      margin-top: 6px;
    }
    .container {
      max-width: 1320px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      overflow: hidden;
      padding: 20px;
    }
    .instructions {
      max-width: 1320px;
      margin: 20px auto 0 auto;
      font-size: 13px;
      color: #64748b;
      display: flex;
      gap: 30px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <span class="badge">LIGHT THEME ARCHITECTURE PREVIEW</span>
      <h1 class="title">Borrower Inbound SMS Servicing Pipeline</h1>
    </div>
  </div>

  <div class="container">
    <object type="image/svg+xml" data="architecture.svg" style="width: 100%; height: auto; display: block;"></object>
  </div>

  <div class="instructions">
    <div>✓ <strong>Editorial Layout:</strong> Expanded canvas (1320px), fixed all connector fill clipping, generous card padding.</div>
    <div>✓ <strong>Typography &amp; Spacing:</strong> Fixed text overlaps, resolved duplicate phrasing, crisp semantic color coding.</div>
  </div>
</body>
</html>
